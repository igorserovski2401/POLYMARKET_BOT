# Shadow-Test-Config — NUR FÜR PHASE-1-TEST
# Kein Live-Trading. shadow_mode=true. Keine Keys in dieser Datei.
# Keys via Env: export ANTHROPIC_API_KEY="..." NEWS_API_KEY="..."

api:
  polymarket_rest_url: "https://clob.polymarket.com"
  polymarket_ws_url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  gamma_api_url: "https://gamma-api.polymarket.com"
  kalshi_api_url: "https://api.elections.kalshi.com/trade-api/v2"
  api_key: "YOUR_API_KEY_HERE"
  api_secret: "YOUR_API_SECRET_HERE"
  passphrase: "YOUR_PASSPHRASE_HERE"
  private_key: "YOUR_PRIVATE_KEY_HERE"
  timeout_seconds: 30
  max_retries: 3
  retry_delay_seconds: 1

trading:
  # Bekannte Polymarket-Market-IDs für Shadow-Test
  # (Sandbox hat keinen Gamma-API-Zugang — simulation-Stubs werden erstellt)
  markets:
    - "21742633143463906290569050155826241533067272736897614950488156847949938836455"
    - "69236923620077691027083946871148646972011131466059644796654161903044801538539"
    - "79682519744203916990386814980570376369027547543426834779979741573571229019486"
  min_edge: 0.01
  bundle_arb_enabled: true
  min_spread: 0.05
  tick_size: 0.01
  mm_enabled: false
  default_order_size: 5
  min_order_size: 2
  max_order_size: 10
  slippage_tolerance: 0.02
  order_timeout_seconds: 60

risk:
  max_position_per_market: 15
  max_global_exposure: 50
  max_daily_loss: 10
  max_drawdown_pct: 0.15
  trade_only_high_volume: false
  min_24h_volume: 10000
  whitelist: []
  blacklist: []
  kill_switch_enabled: true
  auto_unwind_on_breach: false

mode:
  trading_mode: "dry_run"
  data_mode: "simulation"
  cross_platform_enabled: true
  kalshi_enabled: true
  min_match_similarity: 0.6
  dry_run_initial_balance: 10000
  simulate_fills: true
  fill_probability: 0.8

logging:
  console_level: "INFO"
  file_level: "DEBUG"
  log_dir: "logs"
  main_log_file: "bot.log"
  trades_log_file: "trades.log"
  opportunities_log_file: "opportunities.log"
  max_log_size_mb: 50
  backup_count: 5

monitoring:
  snapshot_interval: 60
  heartbeat_interval: 30
  track_latency: true
  track_fill_rates: true

ai_engine:
  enabled: true
  allow_live_trading: false
  # Keys via Env-Vars: ANTHROPIC_API_KEY (Pflicht), NEWS_API_KEY/MEDIASTACK_API_KEY optional
  anthropic_api_key: ""
  news_api_key: ""
  mediastack_api_key: ""
  # Provider: router/gdelt brauchen keinen News-Key
  news_provider: "router"
  fallback_news_provider: "gdelt"
  source_router_enabled: true
  enabled_categories:
    - "crypto_price"
    - "macro_release"
    - "fed_rates"
    - "weather"
    - "legal_regulatory"
    - "company_sec"
    - "generic_news"
  disabled_categories:
    - "politics_election"
    - "geopolitics"
    - "sports"
  model: "claude-sonnet-4-6"
  check_interval_seconds: 15
  max_markets_per_cycle: 3
  calls_per_minute: 3
  news_page_size: 5
  news_max_age_minutes: 720
  min_edge: 0.08
  min_confidence: "high"
  max_spread: 0.03
  default_order_size: 5.0
  max_order_size: 25.0
  shadow_mode: true
  long_only: true
  submit_in_dry_run: false
